
services:
  - type: web
    name: gfa-first-timers
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: BASE_URL
        value: https://gfa-first-timers.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: gfa-db
          property: connectionString

databases:
  - name: gfa-db
    databaseName: gfa_first_timers
    user: gfa_admin
    plan: free
